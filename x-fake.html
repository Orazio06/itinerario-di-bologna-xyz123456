<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Fake - Bologna Turismo</title>
  <style>
    :root {
      --x-black: #000000;
      --x-secondary-text: #71767b;
      --x-background: #e6ecf0;
      --x-card-background: #ffffff;
      --x-border: #e1e8ed;
    }
    
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--x-background);
      color: #14171a;
      position: relative;
      min-height: 100vh;
    }

    /* Sfondo sfocato */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('Fakepage.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.8);
      z-index: -2;
    }

    /* Overlay scuro */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }
    
    /* Header X */
    .x-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--x-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      z-index: 100;
    }
    
    .x-back-button {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 20px;
      margin-right: 15px;
    }
    
    .x-top-title {
      font-weight: 700;
      font-size: 18px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
      text-align: center;
      margin-right: 35px;
    }
    
    /* Container principale */
    .x-container {
      max-width: 600px;
      width: 100%;
      background: var(--x-card-background);
      border-radius: 0;
      overflow: hidden;
      margin: 60px auto 20px;
      border: 1px solid var(--x-border);
    }
    
    /* Header post */
    .x-header {
      display: flex;
      align-items: flex-start;
      padding: 12px 16px;
    }
    
    .x-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin-right: 12px;
      background-color: var(--x-black);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    
    .x-user-info {
      flex: 1;
    }
    
    .x-name {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
    }
    
    .x-username {
      font-size: 15px;
      color: var(--x-secondary-text);
      margin-left: 4px;
    }
    
    .x-post-time {
      font-size: 15px;
      color: var(--x-secondary-text);
      margin-top: 2px;
    }
    
    .x-more {
      color: var(--x-secondary-text);
    }
    
    /* Contenuto post */
    .x-content {
      padding: 0 16px 12px 76px;
    }
    
    .x-text {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    
    .x-image-container {
      margin: 10px 0;
      border-radius: 15px;
      overflow: hidden;
    }
    
    .x-image {
      width: 100%;
      height: auto;
      display: block;
    }
    
    /* Azioni */
    .x-actions {
      display: flex;
      padding: 0 16px 12px 76px;
      color: var(--x-secondary-text);
      font-size: 13px;
    }
    
    .x-action {
      display: flex;
      align-items: center;
      margin-right: 24px;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .x-action:hover {
      color: var(--x-black);
    }
    
    .x-action i {
      margin-right: 6px;
      font-size: 16px;
    }
    
    /* Loader */
    .x-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--x-background);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .x-loader-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--x-black);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!-- Top bar con pulsante torna indietro -->
  <div class="x-top-bar">
    <a href="index.html" class="x-back-button">‹</a>
    <div class="x-top-title">X</div>
  </div>

  <!-- Post X -->
  <div class="x-container">
    <div class="x-header">
      <div class="x-avatar">B</div>
      <div class="x-user-info">
        <div class="x-name">
          Bologna Turismo <span class="x-username">@bolognaturismo · 2h</span>
        </div>
        <div class="x-post-time"></div>
      </div>
      <div class="x-more">···</div>
    </div>
    <div class="x-content">
      <div class="x-text">
        Scopri la magia dell'Art Nouveau a Bologna! 🎨✨ Il nostro nuovo itinerario ti porterà alla scoperta dei più bei palazzi Liberty della città, con visite guidate e laboratori creativi. #Bologna #ArtNouveau #TurismoCulturale
      </div>
      <div class="x-image-container">
        <img src="Post.jpeg" alt="Bologna Art Nouveau" class="x-image">
      </div>
      <div class="x-actions">
        <div class="x-action"><i class="far fa-comment"></i> 24</div>
        <div class="x-action"><i class="fas fa-retweet"></i> 12</div>
        <div class="x-action"><i class="far fa-heart"></i> 87</div>
        <div class="x-action"><i class="fas fa-share"></i></div>
      </div>
    </div>
  </div>

  <!-- Loader -->
  <div class="x-loader" style="display: none;">
    <div class="x-loader-spinner"></div>
  </div>

  <script src="social_translations.js"></script>
  <script>
    // Mostra il loader per 1.5 secondi (simulazione caricamento)
    document.addEventListener('DOMContentLoaded', function() {
      const loader = document.querySelector('.x-loader');
      loader.style.display = 'flex';
      
      setTimeout(() => {
        loader.style.display = 'none';
      }, 1500);

      updateSocialContent(); // Usa la funzione centralizzata
    });
  </script>
</body>
</html>
